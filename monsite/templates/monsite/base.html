<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KOMPETANS{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <script src="{% static 'bootstrap/js/bootstrap.min.js' %}"></script>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    
    <style>
        body {
            padding-top: 56px; /* Ajustez cette valeur en fonction de la hauteur de votre barre de navigation */
        }
    </style>
</head>

 <!-- Barre de navigation -->
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">KOMPETANS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'monsite:index' %}">Accueil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'monsite:services' %}">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'monsite:blog' %}">Blog</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="{% url 'monsite:contact_form' 'générale' %}">Contacts</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

  <!-- Contenu principal -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>
   


 <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>© 2025 Kompetans. Tous droits réservés.</p>
           
            <p>Contact : <a href="mailto:contact@kompetans.com" class="text-white">contact@kompetans.com</a> | 
               Tel : <a href="tel:+33601020304" class="text-white">06 01 02 03 04</a></p>
        </div>
 </footer>
